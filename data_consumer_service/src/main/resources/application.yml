server:
  port: 8082

spring:
  kafka:
    bootstrap-servers: 9092
    consumer:
      group-id: stock-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  datasource:
    url: jdbc:postgresql://localhost:5432/stocks
    username: postgres
    password: secret

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      
alphavantage:
  base-url: https://www.alphavantage.co/query
  api-key: ${ALPHAVANTAGE_API_KEY:demo}
  symbols: ${STOCK_SYMBOLS:IBM}
  request-delay-ms: ${ALPHAVANTAGE_REQUEST_DELAY_MS:15000}

app:
  kafka:
    topic: stock-data
  cache:
    ttl-seconds: 60